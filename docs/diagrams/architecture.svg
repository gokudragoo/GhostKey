  <rect x="244" y="196" width="52" height="16" rx="2" fill="#f6f7f9"/><text x="270" y="208" text-anchor="middle" fill="#71808e" font-size="8" font-family="'IBM Plex Mono', monospace">SIGN</text>
  <path d="M500 224 H600" fill="none" stroke="#2559e8" stroke-width="1.2" marker-end="url(#ghostkey-architecture-blue-arrow)"/>
  <rect x="518" y="196" width="64" height="16" rx="2" fill="#f6f7f9"/><text x="550" y="208" text-anchor="middle" fill="#2559e8" font-size="8" font-family="'IBM Plex Mono', monospace">PROMPT</text>
  <path d="M500 256 H760 Q768 256 768 264 V304 Q768 312 776 312 H844" fill="none" stroke="#71808e" stroke-width="1.2" marker-end="url(#ghostkey-architecture-arrow)"/>
