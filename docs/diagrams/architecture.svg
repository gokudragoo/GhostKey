  <rect x="408" y="294" width="56" height="16" rx="2" fill="#f6f7f9"/><text x="436" y="306" text-anchor="middle" fill="#71808e" font-size="8" font-family="'IBM Plex Mono', monospace">LOG</text>
  <path d="M1004 268 V344" fill="none" stroke="#2559e8" stroke-width="1.2" marker-end="url(#ghostkey-architecture-blue-arrow)"/>
  <rect x="1012" y="294" width="56" height="16" rx="2" fill="#f6f7f9"/><text x="1040" y="306" text-anchor="middle" fill="#2559e8" font-size="8" font-family="'IBM Plex Mono', monospace">ENFORCE</text>

