  <rect x="812" y="116" width="348" height="376" rx="8" fill="#17212b" fill-opacity="0.025" stroke="#71808e" stroke-opacity="0.28"/>
  <rect x="56" y="120" width="100" height="16" rx="2" fill="#f6f7f9"/><text x="106" y="132" text-anchor="middle" fill="#71808e" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">CLIENT</text>
  <rect x="536" y="120" width="104" height="16" rx="2" fill="#f6f7f9"/><text x="588" y="132" text-anchor="middle" fill="#71808e" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">SERVICES</text>
  <rect x="828" y="120" width="92" height="16" rx="2" fill="#f6f7f9"/><text x="874" y="132" text-anchor="middle" fill="#71808e" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">0G CHAIN</text>

