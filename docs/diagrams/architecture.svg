  <rect x="316" y="188" width="40" height="16" rx="2" fill="none" stroke="#2559e8"/><text x="336" y="200" text-anchor="middle" fill="#2559e8" font-size="8" font-family="'IBM Plex Mono', monospace">APP</text>
  <text x="400" y="232" text-anchor="middle" fill="#17212b" font-size="16" font-family="'DM Sans', sans-serif" font-weight="600">GhostKey UI</text>
  <text x="400" y="252" text-anchor="middle" fill="#71808e" font-size="10" font-family="'IBM Plex Mono', monospace">validate · review · simulate</text>

  <rect x="300" y="344" width="200" height="96" rx="6" fill="#ffffff" stroke="#17212b"/>
  <rect x="316" y="356" width="48" height="16" rx="2" fill="none" stroke="#71808e"/><text x="340" y="368" text-anchor="middle" fill="#71808e" font-size="8" font-family="'IBM Plex Mono', monospace">STATE</text>
  <text x="400" y="400" text-anchor="middle" fill="#17212b" font-size="16" font-family="'DM Sans', sans-serif" font-weight="600">Session activity</text>
  <text x="400" y="420" text-anchor="middle" fill="#71808e" font-size="10" font-family="'IBM Plex Mono', monospace">localStorage · CSV export</text>

  <rect x="600" y="176" width="168" height="96" rx="6" fill="#ffffff" stroke="#17212b"/>
  <rect x="616" y="188" width="40" height="16" rx="2" fill="none" stroke="#71808e"/><text x="636" y="200" text-anchor="middle" fill="#71808e" font-size="8" font-family="'IBM Plex Mono', monospace">API</text>
  <text x="684" y="232" text-anchor="middle" fill="#17212b" font-size="16" font-family="'DM Sans', sans-serif" font-weight="600">0G Compute</text>
  <text x="684" y="252" text-anchor="middle" fill="#71808e" font-size="10" font-family="'IBM Plex Mono', monospace">signed prompt → JSON</text>

  <rect x="844" y="176" width="168" height="96" rx="6" fill="#ffffff" stroke="#17212b"/>
  <rect x="860" y="188" width="40" height="16" rx="2" fill="none" stroke="#71808e"/><text x="880" y="200" text-anchor="middle" fill="#71808e" font-size="8" font-family="'IBM Plex Mono', monospace">RPC</text>
  <text x="928" y="232" text-anchor="middle" fill="#17212b" font-size="16" font-family="'DM Sans', sans-serif" font-weight="600">Galileo RPC</text>
  <text x="928" y="252" text-anchor="middle" fill="#71808e" font-size="10" font-family="'IBM Plex Mono', monospace">chain 16602</text>

  <rect x="844" y="344" width="224" height="96" rx="6" fill="#edf2ff" stroke="#2559e8" stroke-width="1.2"/>
  <rect x="860" y="356" width="64" height="16" rx="2" fill="none" stroke="#2559e8"/><text x="892" y="368" text-anchor="middle" fill="#2559e8" font-size="8" font-family="'IBM Plex Mono', monospace">CONTRACT</text>
  <text x="956" y="400" text-anchor="middle" fill="#17212b" font-size="16" font-family="'DM Sans', sans-serif" font-weight="600">GhostKeyManager</text>
  <text x="956" y="420" text-anchor="middle" fill="#71808e" font-size="10" font-family="'IBM Plex Mono', monospace">policy storage + checks</text>

  <line x1="40" y1="540" x2="1160" y2="540" stroke="#71808e" stroke-opacity="0.28"/>
  <text x="40" y="568" fill="#71808e" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="112" y1="564" x2="152" y2="564" stroke="#2559e8" stroke-width="1.2" marker-end="url(#ghostkey-architecture-blue-arrow)"/><text x="164" y="568" fill="#71808e" font-size="10" font-family="'DM Sans', sans-serif">primary request / enforcement</text>
  <line x1="360" y1="564" x2="400" y2="564" stroke="#71808e" stroke-width="1.2" marker-end="url(#ghostkey-architecture-arrow)"/><text x="412" y="568" fill="#71808e" font-size="10" font-family="'DM Sans', sans-serif">read, sign, or local state</text>
  <text x="40" y="608" fill="#71808e" font-size="10" font-family="'IBM Plex Mono', monospace">Static diagram · no private keys leave the wallet</text>
</svg>
