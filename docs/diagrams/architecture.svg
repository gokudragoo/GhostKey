<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="ghostkey-architecture-title ghostkey-architecture-desc">
  <title id="ghostkey-architecture-title">GhostKey runtime architecture</title>
  <desc id="ghostkey-architecture-desc">Architecture showing the wallet and GhostKey browser app connecting to the 0G Compute API, Galileo RPC, and the deployed policy manager contract.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');</style>
    <marker id="ghostkey-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#71808e"/></marker>
    <marker id="ghostkey-architecture-blue-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2559e8"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#f6f7f9"/>
  <text x="40" y="48" fill="#71808e" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="0.16em">GHOSTKEY / ARCHITECTURE</text>
  <text x="40" y="84" fill="#17212b" font-size="28" font-family="'DM Sans', sans-serif" font-weight="600">A bounded path from wallet to policy enforcement</text>
